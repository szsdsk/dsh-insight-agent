name: ci

on:
  push:
  pull_request:

jobs:
  typescript:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
      - run: pnpm run check:config

  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: python -m pip install -e ".\python[dev]"
      - run: python -m pytest python/tests --cov=insight_mcp

  protocol-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -e ".\python[dev]"
      - run: python -m pytest python/tests/test_mcp_stdio.py

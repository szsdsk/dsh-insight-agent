name: InsightAgent

on:
  push:
    branches: [codex/insight-diagnostics, main, master]
  pull_request:

jobs:
  typescript:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.20.0
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -e ".\python\insight-mcp"
      - run: pnpm run build:lib:host
      - run: pnpm run build:lib:client
      - run: pnpm run build:web
      - run: pnpm run insight:check
      - run: pnpm exec vitest run packages/insight/insight-evidence/tests packages/api/insight-controller/tests packages/client/ui-insight-workbench/tests
      - run: pnpm run test:e2e apps/cli/tests/web-agent-presets.e2e.ts -t 'composes InsightAgent'

  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".\python\insight-mcp[dev]"
      - run: python -m pytest python/insight-mcp/tests
